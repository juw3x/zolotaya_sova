services:
  postgres:
    image: postgres:16-alpine
    container_name: sova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zolotaya_sova
      POSTGRES_USER: sova_admin
      POSTGRES_PASSWORD: sova_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sova_admin -d zolotaya_sova"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: sova_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sova_admin:sova_secret_password@postgres:5432/zolotaya_sova
    ports:
      - "8000:8000"

volumes:
  pg_data:
